<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="termwatch: read-only analytics for the public tweets of an X account, with Gemini analysis logged to CSV and JSON" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" y="5" fill="#101a15"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5dffb0"/>
    </marker>
  </defs>
  <rect width="1200" height="340" rx="16" fill="#0b0f0d"/>
  <rect width="1200" height="340" rx="16" fill="url(#scan)"/>

  <text x="60" y="128" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="70" font-weight="700" fill="#e9fff4">termwatch</text>
  <rect x="60" y="146" width="140" height="5" rx="2.5" fill="#5dffb0"/>
  <text x="60" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#b9d8c8">Read-only analytics for the public tweets of an X account.</text>
  <text x="60" y="228" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#6f9482">Gemini describes each tweet. Results go to CSV and JSON.</text>

  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" fill="#5dffb0">
    <rect x="60" y="256" width="118" height="34" rx="17" fill="none" stroke="#2c5a45"/>
    <text x="119" y="278" text-anchor="middle">read-only</text>
    <rect x="190" y="256" width="136" height="34" rx="17" fill="none" stroke="#2c5a45"/>
    <text x="258" y="278" text-anchor="middle">no trading</text>
    <rect x="338" y="256" width="136" height="34" rx="17" fill="none" stroke="#2c5a45"/>
    <text x="406" y="278" text-anchor="middle">no posting</text>
  </g>

  <!-- tweet card -->
  <g transform="translate(620 78)">
    <rect width="250" height="150" rx="14" fill="#101814" stroke="#1f3a2e"/>
    <circle cx="34" cy="36" r="16" fill="#1f3a2e"/>
    <text x="62" y="32" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e9fff4">@example_account</text>
    <text x="62" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b7a6b">public tweet (example)</text>
    <rect x="20" y="82" width="210" height="10" rx="5" fill="#1f3a2e"/>
    <rect x="20" y="104" width="170" height="10" rx="5" fill="#1f3a2e"/>
    <rect x="20" y="126" width="110" height="10" rx="5" fill="#1f3a2e"/>
  </g>
  <line x1="878" y1="153" x2="928" y2="153" stroke="#5dffb0" stroke-width="2" marker-end="url(#ah)"/>
  <text x="903" y="140" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" fill="#6f9482">Gemini</text>

  <!-- analysis card -->
  <g transform="translate(936 48)" font-family="Consolas, 'SF Mono', Menlo, monospace">
    <rect width="224" height="244" rx="14" fill="#101814" stroke="#5dffb0"/>
    <text x="18" y="34" font-size="12" fill="#6f9482">analysis (example)</text>
    <text x="18" y="66" font-size="13" fill="#8fb5a2">mentions_ticker_or_meme</text>
    <text x="18" y="86" font-size="15" fill="#5dffb0">true</text>
    <text x="18" y="120" font-size="13" fill="#8fb5a2">candidate_terms</text>
    <text x="18" y="140" font-size="15" fill="#5dffb0">["moon"]</text>
    <text x="18" y="174" font-size="13" fill="#8fb5a2">tone</text>
    <text x="18" y="194" font-size="15" fill="#5dffb0">"joking"</text>
    <text x="18" y="228" font-size="13" fill="#8fb5a2">summary: one sentence</text>
  </g>
</svg>
