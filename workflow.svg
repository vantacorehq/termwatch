<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="One termwatch cycle: fetch new tweets, analyze with Gemini, write the log, save state, wait, repeat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="1" y="5" fill="#101a15"/></pattern>
  </defs>
  <rect width="1200" height="660" rx="16" fill="#0b0f0d"/>
  <rect width="1200" height="660" rx="16" fill="url(#scan)"/>
  <text x="60" y="58" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e9fff4">One cycle, repeated</text>
  <circle cx="600" cy="350" r="240" fill="none" stroke="#1f3a2e" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M-10 -8 L10 0 L-10 8 z" fill="#5dffb0" transform="translate(741.1 155.8) rotate(36)"/>
  <path d="M-10 -8 L10 0 L-10 8 z" fill="#5dffb0" transform="translate(828.3 424.2) rotate(108)"/>
  <path d="M-10 -8 L10 0 L-10 8 z" fill="#5dffb0" transform="translate(600.0 590.0) rotate(180)"/>
  <path d="M-10 -8 L10 0 L-10 8 z" fill="#5dffb0" transform="translate(371.7 424.2) rotate(252)"/>
  <path d="M-10 -8 L10 0 L-10 8 z" fill="#5dffb0" transform="translate(458.9 155.8) rotate(324)"/>
  <rect x="475.0" y="73.0" width="250" height="74" rx="12" fill="#101814" stroke="#5dffb0" stroke-width="2"/>
  <text x="600.0" y="104.0" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#e9fff4">1  Fetch new tweets</text>
  <text x="600.0" y="126.0" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">X API v2, only newer than since_id</text>
  <rect x="703.3" y="238.8" width="250" height="74" rx="12" fill="#101814" stroke="#5dffb0" stroke-width="2"/>
  <text x="828.3" y="269.8" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#e9fff4">2  Analyze with Gemini</text>
  <text x="828.3" y="291.8" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">JSON: flag, terms, tone, summary</text>
  <rect x="616.1" y="507.2" width="250" height="74" rx="12" fill="#101814" stroke="#5dffb0" stroke-width="2"/>
  <text x="741.1" y="538.2" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#e9fff4">3  Write the log</text>
  <text x="741.1" y="560.2" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">sentiment_log.json and .csv</text>
  <rect x="333.9" y="507.2" width="250" height="74" rx="12" fill="#101814" stroke="#2c5a45" stroke-width="2"/>
  <text x="458.9" y="538.2" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#e9fff4">4  Save state</text>
  <text x="458.9" y="560.2" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">since_id, seen IDs, user IDs</text>
  <rect x="246.7" y="238.8" width="250" height="74" rx="12" fill="#101814" stroke="#2c5a45" stroke-width="2"/>
  <text x="371.7" y="269.8" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#e9fff4">5  Wait</text>
  <text x="371.7" y="291.8" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">interval, or until the limit resets</text>
  <text x="600" y="346" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="20" fill="#5dffb0">termwatch run</text>
  <text x="600" y="372" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6f9482">stop with Ctrl+C, or use --once</text>
  <rect x="965" y="170" width="205" height="110" rx="10" fill="none" stroke="#2c5a45" stroke-dasharray="5 4"/>
  <text x="981" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#b9d8c8">HTTP 429 from X</text>
  <text x="981" y="216" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">the cycle stops and waits</text>
  <text x="981" y="236" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">until the reset time</text>
  <text x="981" y="256" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">that X reports</text>

  <rect x="30" y="170" width="200" height="110" rx="10" fill="none" stroke="#2c5a45" stroke-dasharray="5 4"/>
  <text x="46" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#b9d8c8">--from-now</text>
  <text x="46" y="216" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">the first check of an</text>
  <text x="46" y="236" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">account skips its</text>
  <text x="46" y="256" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">existing tweets</text>

  <rect x="965" y="430" width="205" height="110" rx="10" fill="none" stroke="#2c5a45" stroke-dasharray="5 4"/>
  <text x="981" y="456" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#b9d8c8">Gemini fails?</text>
  <text x="981" y="476" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">a neutral placeholder is</text>
  <text x="981" y="496" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">logged with</text>
  <text x="981" y="516" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">analysis_ok = false</text>

  <rect x="30" y="430" width="200" height="90" rx="10" fill="none" stroke="#2c5a45" stroke-dasharray="5 4"/>
  <text x="46" y="456" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#b9d8c8">Several accounts</text>
  <text x="46" y="476" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">repeat --user, each has</text>
  <text x="46" y="496" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8fb5a2">its own since_id</text>

</svg>
