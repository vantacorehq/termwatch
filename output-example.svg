<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Example log entries and the termwatch report on a demo log (made-up account and tweets)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" y="5" fill="#101a15"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" rx="16" fill="#0b0f0d"/>
  <rect width="1200" height="600" rx="16" fill="url(#scan)"/>
  <text x="60" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e9fff4">What ends up in the log</text>
  <rect x="370" y="30" width="420" height="28" rx="14" fill="none" stroke="#ffd166"/>
  <text x="580" y="49" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffd166">example data: made-up account, tweets and summaries</text>

  <!-- log cards -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="40" y="86" width="560" height="130" rx="12" fill="#101814" stroke="#5dffb0"/>
    <text x="62" y="116" font-size="15" font-weight="600" fill="#e9fff4">@example_account</text>
    <text x="548" y="116" text-anchor="end" font-size="12" fill="#5b7a6b">2026-03-01</text>
    <text x="62" y="142" font-size="15" fill="#b9d8c8">to the moon, again</text>
    <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12.5">
      <rect x="62" y="158" width="74" height="24" rx="12" fill="#5dffb0" fill-opacity="0.15" stroke="#5dffb0"/>
      <text x="99" y="175" text-anchor="middle" fill="#5dffb0">flagged</text>
      <rect x="146" y="158" width="68" height="24" rx="12" fill="none" stroke="#2c5a45"/>
      <text x="180" y="175" text-anchor="middle" fill="#8fb5a2">joking</text>
      <rect x="224" y="158" width="58" height="24" rx="12" fill="none" stroke="#ffd166"/>
      <text x="253" y="175" text-anchor="middle" fill="#ffd166">moon</text>
      <rect x="292" y="158" width="68" height="24" rx="12" fill="none" stroke="#ffd166"/>
      <text x="326" y="175" text-anchor="middle" fill="#ffd166">rocket</text>
    </g>
    <text x="62" y="204" font-size="13" fill="#8fb5a2">A joke about going to the moon.</text>

    <rect x="40" y="232" width="560" height="110" rx="12" fill="#101814" stroke="#1f3a2e"/>
    <text x="62" y="262" font-size="15" font-weight="600" fill="#e9fff4">@example_account</text>
    <text x="548" y="262" text-anchor="end" font-size="12" fill="#5b7a6b">2026-03-01</text>
    <text x="62" y="288" font-size="15" fill="#b9d8c8">coffee break</text>
    <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12.5">
      <rect x="62" y="304" width="82" height="24" rx="12" fill="none" stroke="#2c5a45"/>
      <text x="103" y="321" text-anchor="middle" fill="#5b7a6b">not flagged</text>
      <rect x="154" y="304" width="76" height="24" rx="12" fill="none" stroke="#2c5a45"/>
      <text x="192" y="321" text-anchor="middle" fill="#8fb5a2">neutral</text>
    </g>

    <rect x="40" y="358" width="560" height="110" rx="12" fill="#101814" stroke="#1f3a2e"/>
    <text x="62" y="388" font-size="15" font-weight="600" fill="#e9fff4">@example_account</text>
    <text x="548" y="388" text-anchor="end" font-size="12" fill="#5b7a6b">2026-03-03</text>
    <text x="62" y="414" font-size="15" fill="#b9d8c8">big news tomorrow</text>
    <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12.5">
      <rect x="62" y="430" width="82" height="24" rx="12" fill="none" stroke="#2c5a45"/>
      <text x="103" y="447" text-anchor="middle" fill="#5b7a6b">not flagged</text>
      <rect x="154" y="430" width="76" height="24" rx="12" fill="none" stroke="#2c5a45"/>
      <text x="192" y="447" text-anchor="middle" fill="#8fb5a2">cryptic</text>
    </g>
  </g>
  <text x="40" y="500" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" fill="#5b7a6b">CSV columns: tweet_id, username, created_at, text, mentions_ticker_or_meme,</text>
  <text x="40" y="518" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" fill="#5b7a6b">candidate_terms, tone, summary, analysis_ok, logged_at</text>

  <!-- terminal with real report output -->
  <rect x="640" y="86" width="520" height="440" rx="12" fill="#0d1411" stroke="#1f3a2e"/>
  <rect x="640" y="86" width="520" height="34" rx="12" fill="#13201a"/>
  <rect x="640" y="108" width="520" height="12" fill="#13201a"/>
  <circle cx="664" cy="103" r="5" fill="#2c5a45"/>
  <circle cx="682" cy="103" r="5" fill="#2c5a45"/>
  <circle cx="700" cy="103" r="5" fill="#2c5a45"/>
  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="14" xml:space="preserve">
    <text x="662" y="152" fill="#e9fff4"><tspan fill="#5dffb0">$</tspan> python termwatch.py report --top 5</text>
    <text x="662" y="188" fill="#b9d8c8">Entries: 7 (analysis failed: 0)</text>
    <text x="662" y="210" fill="#b9d8c8">Flagged as ticker/meme mentions: 4</text>
    <text x="662" y="246" fill="#5dffb0">Most frequent candidate terms:</text>
    <text x="662" y="268" fill="#b9d8c8">  1. moon: 2 tweet(s), 2026-03-01 .. 2026-03-04</text>
    <text x="662" y="290" fill="#b9d8c8">  2. rocket: 2 tweet(s), 2026-03-01 .. 2026-03-03</text>
    <text x="662" y="312" fill="#b9d8c8">  3. ship: 1 tweet(s), 2026-03-04</text>
    <text x="662" y="348" fill="#5dffb0">Tone:</text>
    <text x="662" y="370" fill="#b9d8c8">  joking: 3</text>
    <text x="662" y="392" fill="#b9d8c8">  cryptic: 2</text>
    <text x="662" y="414" fill="#b9d8c8">  neutral: 1</text>
    <text x="662" y="436" fill="#b9d8c8">  serious: 1</text>
  </g>
  <text x="662" y="490" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b7a6b">report on a demo log of 7 made-up entries. It counts terms,</text>
  <text x="662" y="508" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b7a6b">it does not predict anything.</text>
</svg>
